# Every push to main and every pull request: the same checks as scripts/check.sh, plus the
# Android build. Linux runners only; the iOS build stays local for now. A push to main that
# passes both jobs publishes its APK as the release "latest".
# Actions are pinned by commit; the tag is in the comment.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, tests, advisories, licences)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rust-toolchain.toml names the toolchain; the no_std build needs a bare-metal target.
      - run: rustup show && rustup target add thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny
      - run: CHECK_SKIP_FUZZ=1 scripts/check.sh

  android:
    name: Android (core, lint, unit tests, release APK)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The core is built twice (device and host): on main only, to spare runner minutes.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the commit count numbers the APK
      - run: rustup show && rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-ndk
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - name: NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" > /dev/null
      - run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" scripts/build-android-core.sh
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # The lasting release key (secrets): every published APK must carry it, or it cannot
      # update the one before. Without it (a fork), the APK gets the runner's debug key and is
      # not published.
      - name: Release key and build number
        env:
          KEYSTORE_B64: ${{ secrets.LICHEN_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "LICHEN_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No release key (secret LICHEN_KEYSTORE_B64): the APK will not be published."
          fi
          echo "LICHEN_VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
      - run: ./gradlew lintDebug testDebugUnitTest assembleRelease
        working-directory: apps/android
        env:
          LICHEN_KEYSTORE_PASSWORD: ${{ secrets.LICHEN_KEYSTORE_PASSWORD }}
      - name: APK, checksum, certificate
        run: |
          mkdir dist
          cp apps/android/app/build/outputs/apk/release/app-release.apk dist/lichen.apk
          (cd dist && sha256sum lichen.apk > lichen.apk.sha256)
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$tools/apksigner" verify --print-certs dist/lichen.apk | tee dist/certificate.txt
          echo "$LICHEN_VERSION_CODE" > dist/build-number.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lichen-apk
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish the APK (release "latest")
    needs: [rust, android]
    # A push to main, or a manual run on main (gh workflow run check --ref main).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the tag and the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lichen-apk
          path: dist
      # Only an APK signed with the release key is published: a debug-signed one could not
      # update the installed app. (apksigner prints "Signer #1 certificate DN: …" or
      # "V2 Signer: certificate DN: …" depending on its version.)
      - name: Signed with the release key?
        id: key
        run: |
          if grep -q 'certificate DN: CN=lichen$' dist/certificate.txt; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The APK is not signed with the release key: not published."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Release "latest"
        if: steps.key.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha256=$(cut -d' ' -f1 dist/lichen.apk.sha256)
          cert=$(sed -n 's/.*certificate SHA-256 digest: //p' dist/certificate.txt | head -1)
          build=$(cat dist/build-number.txt)
          version=$(cat VERSION)
          cat > notes.md <<NOTES
          lichen ${version}, build ${build}: built by CI from \`main\` at ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M') UTC. Each push to \`main\` that passes the checks replaces it.

          **Experimental:** no third party has audited lichen. Read [SECURITY.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/SECURITY.md) before relying on it.

          - Android 12 or later, on a 64-bit ARM phone (arm64-v8a).
          - Install: download \`lichen.apk\` on the phone and open it; Android asks you to allow installs from your browser or file manager. A newer build installs over it and keeps your identity and chats.
          - APK SHA-256: \`${sha256}\`
          - Signing certificate SHA-256: \`${cert}\`. Every build carries this key; check with \`apksigner verify --print-certs lichen.apk\`.

          The iPhone app is built from source with Xcode: see the [README](https://github.com/${GITHUB_REPOSITORY}#ios-app).
          NOTES
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest
          if gh release view latest > /dev/null 2>&1; then
            gh release edit latest --title "lichen ${version} (build ${build})" --notes-file notes.md --latest
          else
            gh release create latest --title "lichen ${version} (build ${build})" --notes-file notes.md --latest --verify-tag
          fi
          gh release upload latest dist/lichen.apk dist/lichen.apk.sha256 --clobber
