# Every pull request and every push to main: the same checks as scripts/check.sh, plus the
# Android build; the iOS UI tests on pull requests only (main gets the tree its pull request
# tested, and a run there would hold the macOS runners the next pull request needs), and only on
# those that change something the iOS app or its tests use (job ios-paths: an Android-only or
# docs-only pull request would hold the five macOS runners about 45 min for nothing). Main only
# takes a pull request once the required checks pass (branch protection; "iOS" sums up the iOS
# shards). A push to main that passes the Rust and Android jobs publishes its APK as a numbered
# release; it also builds the iOS core once, for the Rust cache the iOS shards start from.
# Actions are pinned by commit; the tag is in the comment.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, tests, advisories, licences)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rust-toolchain.toml names the toolchain; the no_std build needs a bare-metal target.
      - run: rustup show && rustup target add thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny
      - run: CHECK_SKIP_FUZZ=1 scripts/check.sh

  android:
    name: Android (core, lint, unit tests, release APK)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the commit count numbers the APK
      - run: rustup show && rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-ndk
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - name: NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          # The download sometimes arrives broken ("Error reading Zip content"): try again.
          for try in 1 2 3; do
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" > /dev/null && break
            [ "$try" = 3 ] && exit 1
            echo "NDK download failed, try $try of 3"
            sleep 20
          done
      # The database is SQLCipher on OpenSSL's libcrypto built from source (ADR-0036): perl and
      # make, both on the runner. The rust cache keeps it after the first build.
      - run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" scripts/build-android-core.sh
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # The lasting release key (secrets): every published APK must carry it, or it cannot
      # update the one before. Without it (a fork), the APK gets the runner's debug key and is
      # not published.
      - name: Release key and build number
        env:
          KEYSTORE_B64: ${{ secrets.LICHEN_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "LICHEN_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No release key (secret LICHEN_KEYSTORE_B64): the APK will not be published."
          fi
          echo "LICHEN_VERSION_CODE=$(scripts/version.sh --build)" >> "$GITHUB_ENV"
          echo "LICHEN_VERSION_NAME=$(scripts/version.sh --version)" >> "$GITHUB_ENV"
      - run: ./gradlew lintDebug testDebugUnitTest assembleRelease
        working-directory: apps/android
        env:
          LICHEN_KEYSTORE_PASSWORD: ${{ secrets.LICHEN_KEYSTORE_PASSWORD }}
      - name: APK, checksum, certificate
        run: |
          mkdir dist
          cp apps/android/app/build/outputs/apk/release/app-release.apk dist/lichen.apk
          (cd dist && sha256sum lichen.apk > lichen.apk.sha256)
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$tools/apksigner" verify --print-certs dist/lichen.apk | tee dist/certificate.txt
          echo "$LICHEN_VERSION_CODE" > dist/build-number.txt
          echo "$LICHEN_VERSION_NAME" > dist/version.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lichen-apk
          path: dist/
          if-no-files-found: error

  # Whether the pull request changes something the iOS app or its tests use (scripts/ios-paths.py:
  # the Rust core and its build inputs, apps/ios/, assets/, config/, testdata/, the iOS scripts,
  # the workflows). In doubt (the changes cannot be listed), yes: a needless run costs time, a
  # missed one lets a broken app in.
  ios-paths:
    name: iOS paths (do the iOS UI tests need to run?)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.paths.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the merge base of the pull request and its base branch
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # The pull request's own changes, since it left its base branch; a file moved out of an
          # iOS path counts by its old path too (--no-renames).
          if files=$(git diff --name-only --no-renames "$BASE...$HEAD"); then
            printf '%s\n' "$files" | python3 -I scripts/ios-paths.py >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The pull request's changes could not be listed: the iOS shards run."
            echo "ios=true" >> "$GITHUB_OUTPUT"
          fi

  ios-shards:
    name: iOS (UI tests on the demo network, ${{ matrix.shard }})
    needs: ios-paths
    if: github.event_name == 'pull_request' && needs.ios-paths.outputs.ios == 'true'
    # Xcode 27 (public preview image): the app is built with Xcode 27.2, as on the Mac.
    runs-on: xcode-27
    # A runner's expected 35 min (2026-11-22): the build 5 to 9 min with the Rust cache, the
    # simulator's first boot 2 to 3 min, xcodebuild's start 3 to 4 min, the share 18 to 21 min
    # (scripts/ui-tests-ios.sh's times), the French pass in the fifth's. Without the cache the
    # core takes 15 to 20 min more, so the limit leaves room for that.
    timeout-minutes: 75
    # docs/testing.md: every scenario the iOS suite covers, in English, its test classes shared
    # out over five runners of one simulator each (scripts/ui-tests-ios.sh --shard; the free plan
    # runs five macOS jobs at once). Clones of the simulator on one runner (3 CPUs, 7 GB) ran each
    # about three times slower than a Mac's simulator: three ran no test in 70 min, two ran two
    # thirds of the suite in 77 min.
    strategy:
      fail-fast: false
      matrix:
        shard: [1/5, 2/5, 3/5, 4/5, 5/5]
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Spotlight off: it indexed the build and the results while the tests ran.
      - run: sudo mdutil -a -i off || true
      # The core for the simulator (its static library and Swift bindings) as main's last build
      # of it left it, when nothing it is built from has changed since: the job ios-cache saves
      # it under the hash of its inputs (the Rust workspace, the files it compiles in, the
      # toolchain, its build script, Xcode). Otherwise the shard builds it (5 to 13 min with the
      # Rust cache).
      - id: core
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/ios/LichenCore.xcframework
            apps/ios/Generated
          key: ios-core-sim-${{ env.DEVELOPER_DIR }}-${{ hashFiles('crates/**', 'config/**', 'testdata/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'scripts/build-ios-core.sh') }}
      # rust-toolchain.toml names the toolchain; the simulator build needs its target only.
      - if: steps.core.outputs.cache-hit != 'true'
        run: rustup show && rustup target add aarch64-apple-ios-sim
      # Restored from main's, which the job ios-cache writes: a pull request reads its base
      # branch's caches, not another pull request's. Not saved here, so that pull requests do not
      # fill the repository's 10 GB with copies of it.
      - if: steps.core.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ios-sim
          save-if: false
      - run: brew install xcodegen && xcodebuild -version && xcrun simctl list runtimes
      # The core for the simulator unless restored, the app and its tests, for the iPhone on the
      # newest runtime (iOS 27.2, the SDK's; the image also has 27.0 and 27.1). The simulator
      # boots after it, alone: its first boot beside a build slowed both. Beside the core built
      # without the Rust cache, 31 to 55 min instead of 17 to 25 (run 44993272942); beside the
      # app's build, that build took 8 to 19 min instead of 2, and the shard gained nothing
      # (runs 45041396513 and 45047997948).
      - name: Build
        run: scripts/ui-tests-ios.sh --build-only ${{ steps.core.outputs.cache-hit == 'true' && '--core-cached' || '' }}
      # Kept for this pull request's next runs when it was built here (tens of MB; the Rust cache
      # is not: its gigabytes would fill the repository's 10 GB).
      - if: steps.core.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/ios/LichenCore.xcframework
            apps/ios/Generated
          key: ${{ steps.core.outputs.cache-primary-key }}
      # The simulator at the end of its first boot first: one that had not finished it stalled
      # loading accessibility, and the test runner gave up before any test ran.
      - name: UI tests in English
        run: scripts/ui-tests-ios.sh --no-build --shard ${{ matrix.shard }} --warm
      # A French pass of the conversation list and of the strings checks, on the last runner
      # (counted in its share: scripts/ui-tests-ios.sh).
      - name: UI tests in French
        if: matrix.shard == '5/5'
        run: scripts/ui-tests-ios.sh --no-build --lang fr --only ChatNavigationTests --only StringsTests
      - if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-ui-tests-${{ strategy.job-index }}
          path: local/ui-tests/
          retention-days: 7

  # What the iOS shards start from, written on main since they do not run there: the simulator's
  # core, and the Rust cache to build it when a pull request changes it; built on one runner when
  # a push to main changes what the core is built from.
  ios-cache:
    name: iOS core for the cache
    if: github.event_name != 'pull_request'
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The core under the same key as the shards read it (ios-shards): saved at the end of the
      # job when it was not there.
      - id: core
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/ios/LichenCore.xcframework
            apps/ios/Generated
          key: ios-core-sim-${{ env.DEVELOPER_DIR }}-${{ hashFiles('crates/**', 'config/**', 'testdata/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'scripts/build-ios-core.sh') }}
      - if: steps.core.outputs.cache-hit != 'true'
        run: rustup show && rustup target add aarch64-apple-ios-sim
      - if: steps.core.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ios-sim
      # What the shards' build runs first (scripts/ui-tests-ios.sh).
      - if: steps.core.outputs.cache-hit != 'true'
        run: scripts/build-ios-core.sh --sim

  # The one check branch protection requires of the iOS tests: every shard passed, or the pull
  # request changes nothing the iOS app or its tests use (ios-paths said so, and the shards were
  # skipped for that reason). Anything else fails: the shards failed, were cancelled, or were
  # skipped because ios-paths itself did not succeed.
  ios:
    name: iOS
    needs: [ios-paths, ios-shards]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed, or none was needed
        env:
          PATHS: ${{ needs.ios-paths.result }}
          NEEDED: ${{ needs.ios-paths.outputs.ios }}
          SHARDS: ${{ needs.ios-shards.result }}
        run: |
          echo "iOS paths: $PATHS (ios=$NEEDED); the iOS shards: $SHARDS"
          if [ "$PATHS" = success ] && [ "$NEEDED" = false ] && [ "$SHARDS" = skipped ]; then
            echo "Nothing the iOS app or its tests use changed: the iOS shards were not needed."
            exit 0
          fi
          test "$SHARDS" = success

  publish:
    name: Publish the APK (a numbered release)
    needs: [rust, android]
    # A push to main, or a manual run on main (gh workflow run check --ref main).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the tag and the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tags: the previous release, for the notes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lichen-apk
          path: dist
      # Only an APK signed with the release key is published: a debug-signed one could not
      # update the installed app. (apksigner prints "Signer #1 certificate DN: …" or
      # "V2 Signer: certificate DN: …" depending on its version.)
      - name: Signed with the release key?
        id: key
        run: |
          if grep -q 'certificate DN: CN=lichen$' dist/certificate.txt; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The APK is not signed with the release key: not published."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      # Every merge to main is a release of its own, numbered MAJOR.MINOR.N (scripts/version.sh,
      # CONTRIBUTING.md "Versions"): GitHub tells those who watch the releases, and
      # releases/latest/download/lichen.apk always gives the newest.
      - name: Release
        if: steps.key.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(cat dist/version.txt)
          build=$(cat dist/build-number.txt)
          tag="v${version}"
          sha256=$(cut -d' ' -f1 dist/lichen.apk.sha256)
          cert=$(sed -n 's/.*certificate SHA-256 digest: //p' dist/certificate.txt | head -1)
          # A run again on the same commit: its release is there, only the files go again.
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/lichen.apk dist/lichen.apk.sha256 --clobber
            exit 0
          fi
          previous=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -n "$previous" ]; then
            changes=$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" -f previous_tag_name="$previous" --jq .body)
          else
            changes="The first numbered release: everything merged since lichen went public, in the [merged pull requests](https://github.com/${GITHUB_REPOSITORY}/pulls?q=is%3Apr+is%3Amerged). From now on each release lists its own."
          fi
          {
            echo "lichen ${version} (build ${build}), built by CI from \`main\` at ${GITHUB_SHA::7}."
            echo
            echo "$changes"
            echo
            echo "## Install"
            echo
            echo "**Experimental:** no third party has audited lichen. Read [SECURITY.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/SECURITY.md) before relying on it."
            echo
            echo "- Android 12 or later, on a 64-bit ARM phone (arm64-v8a)."
            echo "- Download \`lichen.apk\` on the phone and open it; Android asks you to allow installs from your browser or file manager. A newer release installs over it and keeps your identity and chats."
            echo "- APK SHA-256: \`${sha256}\`"
            echo "- Signing certificate SHA-256: \`${cert}\`. Every release carries this key; check with \`apksigner verify --print-certs lichen.apk\`."
            echo
            echo "The iPhone app is built from source with Xcode: see the [README](https://github.com/${GITHUB_REPOSITORY}#ios-app)."
          } > notes.md
          gh release create "$tag" dist/lichen.apk dist/lichen.apk.sha256 \
            --target "$GITHUB_SHA" --title "lichen ${version}" --notes-file notes.md --latest
