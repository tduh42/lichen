[package]
name = "lc-core"
description = "lichen application core: sessions, contacts, paths, airtime budget, events; fake MeshCore network for tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
lc-meshcore.workspace = true
lc-proto.workspace = true
rand_core.workspace = true
rand_chacha.workspace = true
zeroize.workspace = true
serde.workspace = true
sha2.workspace = true
rusqlite.workspace = true
unicode-normalization.workspace = true
miniz_oxide.workspace = true
bip39.workspace = true
toml.workspace = true

# SQLCipher's crypto outside Apple platforms (Android, Linux hosts): OpenSSL's libcrypto, built
# from source and linked statically (ADR-0036). Apple platforms use CommonCrypto.
[target.'cfg(not(target_vendor = "apple"))'.dependencies]
libsqlite3-sys = { workspace = true, optional = true, features = ["bundled-sqlcipher-vendored-openssl"] }

[features]
# The store encrypted at rest (ADR-0036): SQLCipher in place of SQLite. On in the apps' core builds
# (scripts/build-*-core.sh); host tests run with and without it (scripts/check.sh).
sqlcipher = ["rusqlite/bundled-sqlcipher", "dep:libsqlite3-sys"]

[dev-dependencies]
hex.workspace = true

[lints]
workspace = true
