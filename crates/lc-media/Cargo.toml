[package]
name = "lc-media"
description = "lichen media over LoRa: Codec2 voice frames and AVIF thumbnails (ADR-0012)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
codec2.workspace = true
ravif.workspace = true

[build-dependencies]
cc = "1.2"

# The workspace forbids unsafe code; here it is denied, and allowed in codec2_c.rs only (the
# FFI to the vendored Codec2, ADR-0012).
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
