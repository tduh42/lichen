[package]
name = "lc-ffi"
description = "UniFFI bindings of the lichen core for Swift and Kotlin."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]
# The database encrypted at rest (ADR-0036), on every platform at once: on in the apps' core
# builds (scripts/build-ios-core.sh, scripts/build-android-core.sh); the apps follow
# `database_encryption()`.
sqlcipher = ["lc-core/sqlcipher"]

[dependencies]
lc-core.workspace = true
lc-meshcore.workspace = true
lc-proto.workspace = true
lc-media.workspace = true
uniffi = { workspace = true, features = ["tokio"] }
lc-bridge.workspace = true
tokio.workspace = true
qrcode.workspace = true

[dev-dependencies]
rusqlite.workspace = true

[lints]
workspace = true
