<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img">
<title>Location: a position goes out only when the walker drifts more than 50 m from what the receiver extrapolates</title>
<rect width="760" height="260" rx="16" fill="#FFFFFF" stroke="#E2E2DC"/>
<path d="M 50 210 L 430 210 L 430 50 L 710 50" fill="none" stroke="#E2E2DC" stroke-width="2"/>
<circle cx="50" cy="210" r="7" fill="#C2410C"/>
<circle cx="430" cy="210" r="7" fill="#C2410C"/>
<circle cx="430" cy="120" r="7" fill="#C2410C"/>
<circle cx="430" cy="50" r="7" fill="#C2410C"/>
<circle cx="600" cy="50" r="7" fill="#141413"/>
<circle cx="610" cy="50" r="26" fill="none" stroke="#55554F" stroke-dasharray="3 4"/>
<text x="610" y="95" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#55554F" text-anchor="middle">the receiver's guess, 50 m around it</text>
<text x="240" y="235" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#55554F" text-anchor="middle">a straight walk: one position, then nothing</text>
<text x="442" y="140" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#55554F" text-anchor="start">the turn: the guess goes wrong, a new one</text>
<text x="30" y="30" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#141413" text-anchor="start">14 bytes · 4 positions for a 20-minute walk with a turn</text>
</svg>
