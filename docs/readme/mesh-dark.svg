<text x="60" y="197" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#ABABA3" text-anchor="middle">lichen</text>
<rect x="158" y="105" width="64" height="50" rx="10" fill="#262623" stroke="#34342F" />
<path d="M180 141 L186 119 V141 L192 119 V141 L197 130" fill="none" stroke="#FB923C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="190" y="180" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#F4F4F0" text-anchor="middle">your radio</text>
<text x="190" y="197" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#ABABA3" text-anchor="middle">settings, battery</text>
<circle cx="345" cy="130" r="26" fill="#262623" stroke="#34342F"/>
