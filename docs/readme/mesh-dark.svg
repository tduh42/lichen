<text x="345" y="197" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#ABABA3" text-anchor="middle">repeater</text>
<circle cx="500" cy="130" r="26" fill="#262623" stroke="#34342F"/>
<path d="M490 141 L496 119 V141 L502 119 V141 L507 130" fill="none" stroke="#ABABA3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
