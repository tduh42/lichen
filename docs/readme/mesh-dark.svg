<text x="345" y="214" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#ABABA3" text-anchor="middle">status · neighbours · console</text>
<text x="660" y="214" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#ABABA3" text-anchor="middle">posts since the last login</text>
<text x="30" y="242" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#ABABA3" text-anchor="start">Nodes the radio hears, with their type, hops and advertised position, also on the map; channels and rooms by QR code.</text>
<text x="30" y="260" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#ABABA3" text-anchor="start">MeshCore chats, channels and rooms keep MeshCore's own encryption and say so; an admin password is never kept.</text>
</svg>
