<text x="700" y="168" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#ABABA3" text-anchor="middle">app + Rust core</text>
<circle r="7" cy="100" fill="#FB923C"><animate attributeName="cx" dur="7s" repeatCount="indefinite" values="60;225;380;535;700;700;700" keyTimes="0;0.15;0.3;0.45;0.6;0.62;1"/><animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.6;0.62;1"/></circle>
