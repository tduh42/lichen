<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" role="img">
<title>A direct message from Alice's phone to Bob's: Bluetooth to a stock companion, LoRa through a stock repeater, back over Bluetooth</title>
