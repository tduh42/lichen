[workspace]
resolver = "3"
members = ["crates/*"]
# fuzz/ (nightly) and sim/ (depends on oxymesh, optional) have their own workspaces.
exclude = ["fuzz", "sim"]

[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
# Internal
lc-meshcore = { path = "crates/lc-meshcore" }
lc-proto = { path = "crates/lc-proto" }
lc-core = { path = "crates/lc-core" }
lc-ffi = { path = "crates/lc-ffi" }
lc-media = { path = "crates/lc-media" }
lc-bridge = { path = "crates/lc-bridge" }

# no_std
# The AEAD of every frame (ADR-0028): RFC 8439, full tag. The two primitives below only build the
# independent reference of lc-proto's tests.
chacha20poly1305 = { version = "0.11", default-features = false }
chacha20 = { version = "0.10", default-features = false, features = ["cipher"] }
poly1305 = { version = "0.9", default-features = false }
hkdf = { version = "0.13", default-features = false }
hmac = { version = "0.13", default-features = false }
sha2 = { version = "0.11", default-features = false }
curve25519-dalek = { version = "5.0", default-features = false }
ed25519-dalek = { version = "3.0", default-features = false, features = ["hazmat"] }

# std only (application core, CLI, tests)
rand_core = { version = "0.10", default-features = false }
zeroize = { version = "1.9", default-features = false }
rand_chacha = { version = "0.10", default-features = false, features = ["std"] }
proptest = "1.12"
serde = { version = "1.0", features = ["derive"] }
toml = "1.2"
hex = "0.4"
clap = { version = "4.6", features = ["derive"] }
serialport = { version = "4.10", default-features = false }
getrandom = "0.4"
uniffi = "0.32"
# 0.40: Arti's directory cache (tor-dirmgr) needs < 0.41, and only one SQLite can be linked.
rusqlite = { version = "0.40", features = ["bundled"] }
unicode-normalization = "0.1"
# Small files compressed before LoRa (ADR-0023): pure Rust, no unsafe.
miniz_oxide = "0.9"
# Media (ADR-0012): Codec2 voice (pure Rust, LGPL-2.1), AVIF thumbnails (rav1e, no assembly).
codec2 = "0.3"
ravif = { version = "0.13", default-features = false }
# Recovery phrase of the phone identity (ADR-0013), English list only.
bip39 = { version = "3.0", default-features = false, features = ["std"] }
# Internet bridge (ADR-0015).
iroh = "1.4"
blake3 = "1.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "io-util", "sync", "net"] }
# Tor (L7b): Arti, pinned exactly: onion services keyed by us need its experimental API
# (launch_onion_service_with_hsid) and the in-memory keystore.
arti-client = { version = "=0.48.0", default-features = false, features = ["tokio", "rustls", "compression", "onion-service-client", "onion-service-service", "experimental-api", "ephemeral-keystore"] }
tor-hsservice = "=0.48.0"
tor-hscrypto = "=0.48.0"
tor-llcrypto = "=0.48.0"
tor-cell = "=0.48.0"
tor-proto = { version = "=0.48.0", default-features = false }
tor-keymgr = { version = "=0.48.0", default-features = false, features = ["ephemeral-keystore"] }
tor-config = "=0.48.0"
tor-rtcompat = { version = "=0.48.0", default-features = false, features = ["tokio", "rustls"] }
safelog = "0.10"
futures = "0.3"
# GIFs by id from their provider (ADR-0025): HTTPS GET, the versions iroh already brings in.
hyper = { version = "1.12", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0"
# QR codes of contact cards in the CLI (SVG only).
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.test]
opt-level = 1
