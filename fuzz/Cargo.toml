[package]
name = "lichen-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
lc-meshcore = { path = "../crates/lc-meshcore" }
lc-proto = { path = "../crates/lc-proto" }
lc-core = { path = "../crates/lc-core" }
lc-media = { path = "../crates/lc-media" }

# Separate workspace: nightly toolchain and instrumentation specific to fuzzing.
[workspace]
members = ["."]

[[bin]]
name = "companion_response"
path = "fuzz_targets/companion_response.rs"
test = false
doc = false
bench = false

