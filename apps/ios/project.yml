# XcodeGen project: `xcodegen generate` writes Lichen.xcodeproj (not committed).
# The core comes from `scripts/build-ios-core.sh` (LichenCore.xcframework + Generated/).
name: Lichen
options:
  bundleIdPrefix: com.tduhamel
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
packages:
  # Maps (ADR-0011): MapLibre Native, OpenFreeMap tiles, offline packs.
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.31.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Lichen:
    type: application
    platform: iOS
    sources:
      - path: Lichen
      - path: Generated
        excludes:
          - "*.h"
          - "*.modulemap"
    dependencies:
      - framework: LichenCore.xcframework
        embed: false
      - package: MapLibre
      # iroh reads DNS and proxy settings through SystemConfiguration (ADR-0015).
      - sdk: SystemConfiguration.framework
    info:
      path: Lichen/Info.plist
      properties:
        CFBundleDisplayName: lichen
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBluetoothAlwaysUsageDescription: lichen talks to your MeshCore node over Bluetooth.
        NSCameraUsageDescription: lichen scans your contacts' codes to add them, verified, in person.
        NSMicrophoneUsageDescription: lichen records your voice messages, encoded with Codec2 to fit on LoRa.
        NSLocationWhenInUseUsageDescription: lichen sends your position, encrypted, to the people and groups you share it with, and shows you on the map.
        UIBackgroundModes: [bluetooth-central, location]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tduhamel.lichen
        DEVELOPMENT_TEAM: A3QVD3333F
        # The Rust core is built for arm64 only (Apple Silicon simulators and iPhones).
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
