# XcodeGen project: `xcodegen generate` writes Lichen.xcodeproj (not committed).
# The core comes from `scripts/build-ios-core.sh` (LichenCore.xcframework + Generated/).
name: Lichen
options:
  bundleIdPrefix: com.tduhamel
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Lichen:
    type: application
    platform: iOS
    sources:
      - path: Lichen
      - path: Generated
        excludes:
          - "*.h"
          - "*.modulemap"
    dependencies:
      - framework: LichenCore.xcframework
        embed: false
    info:
      path: Lichen/Info.plist
      properties:
        CFBundleDisplayName: lichen
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBluetoothAlwaysUsageDescription: lichen talks to your MeshCore node over Bluetooth.
        UIBackgroundModes: [bluetooth-central]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tduhamel.lichen
        DEVELOPMENT_TEAM: A3QVD3333F
        # The Rust core is built for arm64 only (Apple Silicon simulators and iPhones).
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
