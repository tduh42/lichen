# XcodeGen project: `xcodegen generate` writes Lichen.xcodeproj (not committed).
# The core comes from `scripts/build-ios-core.sh` (LichenCore.xcframework + Generated/).
name: Lichen
options:
  bundleIdPrefix: com.tduhamel
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
packages:
  # Maps (ADR-0011): MapLibre Native, OpenFreeMap tiles, offline packs.
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.31.0
  # Stickers (ADR-0025): Lottie animations, Apache 2.0.
  Lottie:
    url: https://github.com/airbnb/lottie-spm
    exactVersion: 4.6.1
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.9.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Lichen:
    type: application
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Lichen
      - path: Generated
        excludes:
          - "*.h"
          - "*.modulemap"
      # The sticker set (ADR-0025), as a folder in the bundle: noto/manifest.json and the files.
      - path: ../../assets/stickers/noto
        type: folder
        buildPhase: resources
    dependencies:
      - framework: LichenCore.xcframework
        embed: false
      - package: MapLibre
      - package: Lottie
      # iroh reads DNS and proxy settings through SystemConfiguration (ADR-0015).
      - sdk: SystemConfiguration.framework
    info:
      path: Lichen/Info.plist
      properties:
        # The version comes from the build settings above (the repository\'s VERSION file).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: lichen
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBluetoothAlwaysUsageDescription: lichen talks to your MeshCore node over Bluetooth.
        NSCameraUsageDescription: lichen scans your contacts' codes to add them, verified, in person.
        NSMicrophoneUsageDescription: lichen records your voice messages, encoded with Codec2 to fit on LoRa.
        NSLocationWhenInUseUsageDescription: lichen sends your position, encrypted, to the people and groups you share it with, and shows you on the map.
        NSFaceIDUsageDescription: lichen asks for Face ID to unlock when the app lock is on.
        UIBackgroundModes: [bluetooth-central, location]
    settings:
      base:
        # Team and identifier: Signing.xcconfig, overridden by a git-ignored Local.xcconfig.
        PRODUCT_BUNDLE_IDENTIFIER: $(LICHEN_BUNDLE_ID)
        # The Rust core is built for arm64 only (Apple Silicon simulators and iPhones).
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  # UI tests on the demo network (`-demo YES`): navigation and scrolling as a user does them.
  LichenUITests:
    type: bundle.ui-testing
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: LichenUITests
    dependencies:
      - target: Lichen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LICHEN_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Lichen
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
schemes:
  Lichen:
    build:
      targets:
        Lichen: all
        LichenUITests: [test]
    test:
      targets:
        - LichenUITests

